// ── JOINT VISIT GROUPING ──────────────────────────────────────────
// Groups visits sharing a joint_visit_id into a single merged row.
// Solo visits (joint_visit_id null) pass through unchanged.
function groupJointVisits(visits) {
  const groups = {};
  const order = [];
  visits.forEach(v => {
    const key = v.joint_visit_id || ('solo_' + v.id);
    if (!groups[key]) { groups[key] = []; order.push(key); }
    groups[key].push(v);
  });
  return order.map(key => {
    const group = groups[key];
    if (group.length === 1) return group[0]; // solo visit, unchanged
    // Merge: combine PSW names, use first row as base, average hours
    const merged = Object.assign({}, group[0]);
    const pswNames = [...new Set(group.map(v => v.psw_name).filter(Boolean))];
    merged.psw_name = pswNames.join(' + ');
    merged.is_joint = true;
    merged.joint_psw_count = pswNames.length;
    // Hours: use the max individual hours (both PSWs worked the full visit)
    merged.hours_worked = Math.max(...group.map(v => parseFloat(v.hours_worked || 0))).toFixed(2);
    // Merge summaries if both PSWs wrote notes
    const summaries = group.map(v => v.visit_summary).filter(Boolean);
    if (summaries.length > 1) merged.visit_summary = summaries.join(' | ');
    return merged;
  });
}

function visitRow(v) {
  const d = new Date((v.visit_date || '') + 'T12:00:00');
  const day = d.toLocaleDateString('en-CA', { weekday: 'short' });
  const num = d.getDate();
  const hrs = parseFloat(v.hours_worked || 0).toFixed(1);
  const tin = v.time_in ? fmtTime(v.time_in) : '';
  const tout = v.time_out ? fmtTime(v.time_out) : '';
  const fallbackPSW = (portalData && portalData.psw && portalData.psw.name) ? portalData.psw.name : 'PSW';
  const rated = v.satisfaction_rating;
  const summary = v.visit_summary || '';
  const tasks = Array.isArray(v.tasks_completed) ? v.tasks_completed.join(', ') : (v.tasks_completed || '');
  const mood = v.client_mood || '';
  const vid = 'vd_' + (v.id || Math.random().toString(36).slice(2));

  const starsHtml = rated
    ? `<div class="visit-stars rated">${starsRow(rated)}<span class="stars-label">Rated ${rated}/5</span></div>`
    : `<div class="visit-stars unrated">${[1,2,3,4,5].map(s =>
        `<button class="star-btn" onclick="rateVisit('${v.id}','${(clientSlug||'')}',${s},this)" aria-label="${s} star">${starSVG(false)}</button>`
      ).join('')}<span class="stars-label">Rate this visit</span></div>`;

  // v.notes removed. There is no notes column on visits and no visit_notes in the
  // 32 column family allowlist, so this term was permanently falsy and the Notes
  // block below could never render. PSW free text does exist, on vitals.notes,
  // but surfacing operator facing notes to families is a product decision and not
  // this fix. visit_summary already renders above as Care Summary.
  const hasDetail = summary || tasks || mood || v.visit_stage === 'not_home' || v.incident_reported;
  const detailHtml = hasDetail ? `
    <div id="${vid}" style="display:none;">
      <div class="visit-detail">
        ${summary ? `<div class="visit-detail-lbl">Care Summary</div><div class="visit-detail-val">${summary}</div>` : ''}
        ${mood ? `<div class="visit-detail-lbl">Client Mood</div><div class="visit-detail-val">${mood}</div>` : ''}
        ${tasks ? `<div class="visit-detail-lbl">Tasks Completed</div><div class="visit-detail-val">${tasks}</div>` : ''}
        ${v.visit_stage === 'not_home' ? `<div class="visit-detail-lbl" style="color:var(--amber);">Nobody Home</div><div class="visit-detail-val" style="color:var(--amber);">Your caregiver arrived${v.not_home_at ? ' at ' + fmtTime(new Date(v.not_home_at).toTimeString().slice(0,5)) : ''} and could not get an answer at the door.${v.not_home_note ? ' ' + escHtml(v.not_home_note) : ''}${v.not_home_resolved ? ' This has been followed up by the office.' : ' Your coordinator has been notified.'}</div>` : ''}
        ${v.incident_reported ? `<div class="visit-detail-lbl" style="color:var(--error);">Incident Reported</div><div class="visit-detail-val" style="color:var(--error);">An incident was reported during this visit. Your coordinator has been notified.</div>` : ''}
        ${v.meds_given && Array.isArray(v.meds_given) && v.meds_given.length ? `<div class="visit-detail-lbl">Medications Given</div><div class="visit-detail-val">${v.meds_given.join(', ')}</div>` : ''}
        ${(portalData && portalData.visit_vitals && portalData.visit_vitals[v.id]) ? `<div class="visit-detail-lbl">Health Readings</div><div class="vitals-compact">${formatVitalsCompact(portalData.visit_vitals[v.id])}</div>` : ''}
        ${starsHtml}
      </div>
    </div>` : '';

  return `<div class="visit-row" ${hasDetail ? `onclick="toggleVisitDetail('${vid}',this)" style="cursor:pointer;"` : ''}>
    <div class="visit-date-box">
      <div class="visit-date-day">${day}</div>
      <div class="visit-date-num">${num}</div>
    </div>
    <div class="visit-info" style="flex:1;min-width:0;">
      <div class="visit-psw">${v.psw_name || fallbackPSW}${v.joint_visit_id ? ' <span style=\"display:inline-flex;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:100px;border:1px solid rgba(52,211,153,.3);color:var(--teal2);margin-left:6px;vertical-align:middle;\">joint</span>' : ''}</div>
      <div class="visit-time">${tin}${tout ? ' \u2013 ' + tout : ''}</div>
      ${!hasDetail ? starsHtml : '<div class="visit-expand-btn">View details \u203a</div>'}
    </div>
    <div class="visit-hours">${hrs} hrs</div>
  </div>${detailHtml}`;
}

async function rateVisit(visitId, slug, rating, btn) {
  const row = btn.closest('.visit-stars');
  if (!row) return;
  const btns = row.querySelectorAll('.star-btn');
  btns.forEach((b, i) => { b.innerHTML = starSVG(i < rating); b.disabled = true; });
  try {
    const res = await fetch(`${R}/family/rate-visit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug: (slug||clientSlug||''), visit_id: visitId, rating, pin: sessionStorage.getItem('family_pin_' + (slug||clientSlug||'')) || '' })
    });
    const d = await res.json();
    if (!d.success) throw new Error(d.error || 'Rating failed');

  } catch(e) {

    alert('Could not save rating. Please try again.');
  }
}

async function sendMsg() {
  const ta = document.getElementById('msgTa');
  const msg = ta?.value?.trim();
  if (!msg) return;
  ta.value = ''; ta.style.height = 'auto';
  const cc = document.getElementById('msgCharCount');
  if (cc) cc.style.display = 'none';
  try {
    const r = await fetch(`${R}/family/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, pin: famPin(), message: msg })
    });
    let d = {};
    try { d = await r.json(); } catch (_) { d = {}; }
    if (!r.ok || d.success === false) throw new Error(d.error || 'Message not sent');
    await loadFamilyMessages();
  } catch (e) {
    // The message never reached the office. Put the text back so it is not lost,
    // and say so. Previously this cleared the box and swallowed the failure, so
    // a family believed the office had been told when nobody had.
    if (ta) {
      ta.value = msg;
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
      ta.focus();
    }
    const err = document.getElementById('msgSendError');
    if (err) {
      err.textContent = 'Not sent. Check your connection and try again.';
      err.style.display = 'block';
      setTimeout(() => { err.style.display = 'none'; }, 6000);
    }
  }
}

// Auto-refresh every 60s
// ── C1: Supabase Realtime, replaces 60s polling with instant events ──
// Falls back to 60s polling if Realtime unavailable
function initRealtime() {
  const sb = getSupaClient();
  if (!sb) {
    // No supabase client yet, use polling fallback
    startPollingFallback();
    return;
  }

  // Clean up existing channel if reconnecting
  if (_realtimeCh) { try { sb.removeChannel(_realtimeCh); } catch {} _realtimeCh = null; }

  _realtimeCh = sb
    .channel(`family_${slug}`)
    .on('postgres_changes', {
      event:  '*',
      schema: 'public',
      table:  'visits',
      filter: `client_name=eq.${encodeURIComponent(portalData?.client?.first_name + ' ' + (portalData?.client?.last_name || '')).replace(/%20/g, ' ')}`
    }, async (payload) => {
      // C1: Visit changed, refresh portal data and show live toast
      try {
        const res = await fetch(famUrl(`/family/portal/${slug}`));
        if (famHandle401(res)) return;
        const d   = await res.json();
        if (d.success) {
          const wasActive = portalData?.today_visit?.status === 'in_progress';
          const isActive  = d.today_visit?.status === 'in_progress';
          portalData = d;

          // Show arrival toast if PSW just checked in
          if (!wasActive && isActive) {
            const pswFirst = (d.today_visit?.psw_name || 'Your caregiver').split(' ')[0];
            showLiveToast(`${pswFirst} has arrived`, 'arrival');
          }
          // Show departure toast if PSW just checked out
          if (wasActive && !isActive && payload.eventType === 'UPDATE') {
            showLiveToast('Visit completed', 'departure');
          }

          const activeTab = document.querySelector('.nav-btn.on')?.id?.replace('nav-','');
          if (activeTab) showTab(activeTab);
          loadETABanner();
        }
      } catch {}
    })
    .on('postgres_changes', {
      event:  'INSERT',
      schema: 'public',
      table:  'messages',
      filter: `client_slug=eq.${slug}`
    }, () => {
      // C2: New message, reload message thread instantly
      loadFamilyMessages();
    })
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        console.log('[Realtime] Connected to family channel');
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
        console.warn('[Realtime] Channel error, falling back to polling');
        startPollingFallback();
      }
    });
}

const VAPID_PUBLIC_KEY = 'BD9E2x87i80k-Yt8Ye09irrQQD3Xlf3EtCUIbbjwlwnYoPS6AHaX2_12rZ-7aKQs13WmXfKMx5A4aUuqr3M8wIk';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return new Uint8Array([...raw].map(c => c.charCodeAt(0)));
}

async function requestPushPermission() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const permission = await Notification.requestPermission();
    if (permission === 'granted') { await subscribeToPush(); }
  } catch (e) { console.log('Push permission error:', e); }
}

async function subscribeToPush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    await sendSubscriptionToServer(sub);
  } catch (e) { console.log('Push subscribe error:', e); }
}

async function sendSubscriptionToServer(subscription) {
  try {
    await fetch(`${R}/family/push-subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, pin: famPin(), subscription: subscription.toJSON() })
    });
  } catch (e) { console.log('Push server save error:', e); }
}

async function submitCarePause(btn){
  const from = (document.getElementById('pause-from')||{}).value || '';
  const to = (document.getElementById('pause-to')||{}).value || '';
  const reason = (document.getElementById('pause-reason')||{}).value || '';
  if(!from){ showToast('Please choose a start date'); return; }
  // Bounded range → structured time-off request (lands in HQ inbox, auto-pauses visits on approve)
  if(to){
    try{
      if(btn){ btn.disabled = true; btn.textContent = 'Sending...'; }
      const res = await fetch(`${R}/family/time-off`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ slug: clientSlug || slug, from_date: from, until_date: to, reason, pin: famPin() })
      });
      const d = await res.json();
      if(!res.ok || !d.success) throw new Error(d.error||'Failed');
      closeScheduleSheet();
      showScheduleConfirm('Pause requested', 'Your coordinator will confirm and hold visits for these dates.');
    }catch(e){
      showToast('Could not send request. Try again.', 'err');
      if(btn){ btn.disabled = false; btn.textContent = 'Request pause'; }
    }
    return;
  }
  // Open-ended (no end date) → freeform message fallback, coordinator handles manually
  const body = `Pause from: ${from}\nUntil: unsure / will advise\nReason: ${reason||'(none given)'}`;
  const ok = await sendScheduleRequest('CARE PAUSE', body, btn);
  if(ok){ closeScheduleSheet(); showScheduleConfirm('Pause requested', 'Your coordinator will hold visits for this period and confirm.'); }

function fmtTime(str) {
  if (!str) return '';
  // ISO timestamps (from DB with timezone), convert to Toronto time
  if (str.includes('T') || str.includes('Z') || str.includes('+')) {
    return new Date(str).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',timeZone:'America/Toronto',hour12:false});
  }
  // HH:MM strings, already stored as Toronto local time, display as-is
  const parts = str.split(':');
  if (parts.length >= 2) {
    const h = parseInt(parts[0]), m = parseInt(parts[1]);
    const pad = n => String(n).padStart(2,'0');
    return pad(h) + ':' + pad(m);
  }
  return str;
}

  const clientName = (portalData.client?.first_name || '') + ' ' + (portalData.client?.last_name || '');

  // Use cached coords if already geocoded
  if (window._clientMapCoords) {
    clientLat = window._clientMapCoords.lat;
    clientLng = window._clientMapCoords.lng;
  } else if (portalData.client?.latitude && portalData.client?.longitude) {
    clientLat = parseFloat(portalData.client.latitude);
    clientLng = parseFloat(portalData.client.longitude);
    window._clientMapCoords = { lat: clientLat, lng: clientLng };
  } else {
    // Geocode from care notes address hint or fall back to Mississauga default
    try {
      const addr = encodeURIComponent('Mississauga Ontario Canada');
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + addr, {
        headers: { 'Accept-Language': 'en', 'User-Agent': 'ProximityCare/1.0' }
      });
      const d = await r.json();
      if (d && d[0]) {
        clientLat = parseFloat(d[0].lat);
        clientLng = parseFloat(d[0].lon);
        window._clientMapCoords = { lat: clientLat, lng: clientLng };
      }
    } catch {}
  }

  // Build visit pins from recent visits
  // Toronto-aware today, avoids UTC date being "tomorrow" after 8pm ET
  const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/Toronto'});
  const visits = (portalData.visits || []).slice(0, 10);
  const todayVisit = portalData.today_visit || null;

  // Destroy and recreate map to avoid Leaflet "already initialized" error
  if (_mapInstance) {
    _mapInstance.remove();
    _mapInstance = null;
  }
  mapEl.innerHTML = '';

  // Initialize Leaflet map
  const map = L.map(mapEl, {
    center: [clientLat, clientLng],
    zoom: 14,
    zoomControl: true,
    attributionControl: false
  });
  _mapInstance = map;

  // Dark-style tiles (CartoDB dark matter, no API key)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2fi0_1_34bc781e5a902b3b9391ab79', {
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);

  if (tab === 'access') {
    el.innerHTML = `
      <div class="section">
        <div class="section-title">Who Accessed Your Record</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px;font-family:var(--mono);letter-spacing:.5px;">PHIPA s.52-54 · Last 90 days</div>
        <div id="access-log-list">
          <div class="skeleton-block" style="height:52px;margin-bottom:8px;"></div>
          <div class="skeleton-block" style="height:52px;margin-bottom:8px;"></div>
          <div class="skeleton-block" style="height:52px;"></div>
        </div>
      </div>`;
    loadAccessLog();
  }

  // ── Client home marker (gold) ──
  const homeIcon = L.divIcon({
    html: '<div style="width:14px;height:14px;border-radius:50%;background:#c9a96e;border:2.5px solid #fff;box-shadow:0 0 8px rgba(201,169,110,.7);"></div>',
    iconSize: [14,14], iconAnchor: [7,7], className: ''
  });
  L.marker([clientLat, clientLng], { icon: homeIcon })
    .addTo(map)
    .bindPopup('<b style="font-size:13px;">' + (clientName.trim() || 'Client') + '</b><br><span style="font-size:11px;color:#888;">Client Home</span>');

  // ── Visit markers ──
  // Spread visit markers slightly around client home (simulate PSW nearby check-in)
  // Real GPS: use v.checkin_latitude / v.checkin_longitude if server adds them later
  // For now: offset each visit slightly so pins don't stack
  const allVisits = [];
  if (todayVisit && (todayVisit.time_in && !todayVisit.time_out)) {
    allVisits.push({ ...todayVisit, _active: true });
  }
  visits.forEach(v => {
    if (!(todayVisit && v.id === todayVisit.id)) allVisits.push(v);
  });

  // Group visits by PSW, show each PSW once on the map
  const pswMap = {};
  allVisits.forEach(v => {
    const name = v.psw_name || (portalData.psw && portalData.psw.name) || 'PSW';
    if (!pswMap[name]) pswMap[name] = [];
    pswMap[name].push(v);
  });

  const pswNames = Object.keys(pswMap);
  const angleStep = pswNames.length > 1 ? (2 * Math.PI / pswNames.length) : 0;
  const SPREAD = 0.0012; // ~130m offset

  pswNames.forEach((name, i) => {
    const isActive = pswMap[name].some(v => v._active || (v.time_in && !v.time_out));
    const latestVisit = pswMap[name][0];
    const ini = name.split(' ').map(w => w[0]||'').join('').toUpperCase().slice(0,2);
    const angle = angleStep * i;
    const lat = clientLat + (pswNames.length > 1 ? Math.cos(angle) * SPREAD : SPREAD * 0.5);
    const lng = clientLng + (pswNames.length > 1 ? Math.sin(angle) * SPREAD : 0);

    const color = isActive ? '#4a9a6e' : '#6dbdd4';
    const pulse = isActive
      ? 'box-shadow:0 0 0 3px rgba(74,154,110,.4),0 0 12px rgba(74,154,110,.6);animation:map-pulse 1.5s infinite;'
      : 'box-shadow:0 2px 6px rgba(0,0,0,.4);';

    const icon = L.divIcon({
      html: `<div style="width:32px;height:32px;border-radius:50%;background:${color};border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:11px;font-weight:700;color:#fff;${pulse}">${ini}</div>`,
      iconSize: [32,32], iconAnchor: [16,16], className: ''
    });

    const tin = latestVisit.time_in ? fmtTime(latestVisit.time_in) : '';
    const tout = latestVisit.time_out ? fmtTime(latestVisit.time_out) : '';
    const visitCount = pswMap[name].length;
    const popupContent = `
      <div style="font-size:13px;font-weight:600;margin-bottom:3px;">${name}</div>
      <div style="font-size:11px;color:#666;margin-bottom:2px;">${isActive ? '● Active now · since ' + tin : tin + (tout ? ', ' + tout : '')}</div>
      <div style="font-size:11px;color:#888;">${visitCount} visit${visitCount!==1?'s':''} on record</div>`;

    L.marker([lat, lng], { icon })
      .addTo(map)
      .bindPopup(popupContent);
  });

  // Fit map to show all markers
  if (pswNames.length > 0) {
    map.setView([clientLat, clientLng], 15);
  }

  // ── Build visit list below map ──
  const listEl = document.getElementById('map-visit-list');
  if (listEl) {
    const rows = allVisits.slice(0,8).map(v => {
      const isActive = v._active || (v.time_in && !v.time_out);
      const ini = (v.psw_name||'?').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2);
      const tin = v.time_in ? fmtTime(v.time_in) : '';
      const tout = v.time_out ? fmtTime(v.time_out) : '';
      const date = v.visit_date ? fmtDate(v.visit_date) : 'Today';
      return `<div class="map-visit-row">
        <div class="map-visit-ini ${isActive?'active':'done'}">${ini}</div>
        <div class="map-visit-info">
          <div class="map-visit-name">${v.psw_name || 'PSW'}</div>
          <div class="map-visit-time">${date} · ${tin}${tout?', '+tout:' (in progress)'}</div>
        </div>
        <span class="map-visit-badge ${isActive?'active':'done'}">${isActive?'Active':'Done'}</span>
      </div>`;
    });
    listEl.innerHTML = rows.length ? rows.join('') : '<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center;">No recent visits</div>';
  }
}


// ── ARRIVAL TOAST, real-time caregiver arrival notification ──
function showArrivalToast(caregiver, timeStr) {
  // Remove any existing toast
  const existing = document.getElementById('arrival-toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.id = 'arrival-toast';
  toast.setAttribute('role', 'status');
  toast.setAttribute('aria-live', 'polite');
  toast.style.cssText = 'position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:999;background:var(--c-good-soft,rgba(74,154,110,.12));border:1.5px solid rgba(74,154,110,.35);border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.25);max-width:calc(100vw - 32px);width:360px;';
  toast.innerHTML = `
    <div style="width:36px;height:36px;border-radius:50%;background:var(--c-good,#4a9a6e);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" width="18" height="18"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="font-size:15px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(caregiver)} arrived at ${escHtml(timeStr)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:2px;">Visit started</div>
    </div>
    <button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px;min-height:44px;min-width:44px;" aria-label="Dismiss">×</button>
  `;
  document.body.appendChild(toast);
  if (navigator.vibrate) navigator.vibrate(15);
  // Auto dismiss after 8 seconds
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 8000);
  // Reload portal data to show updated visit
  if (typeof loadPortal === 'function') setTimeout(() => loadPortal(true), 2000);
}

// ── SSE ARRIVAL WIRING ──
function connectArrivalSSE() {
  if (!window.slug || !window.pinVal) return;
  if (!window.EventSource) return; // fallback, polling already handles updates
  // Wire arrival events to toast
  const es = new EventSource(`${R}/family/portal/${window.slug}?pin=${encodeURIComponent(window.pinVal)}&sse=1`);
  es.addEventListener('arrival', e => {
    try {
      const d = JSON.parse(e.data);
      const timeStr = d.time_in ? new Date('1970-01-01T'+d.time_in).toLocaleTimeString('en-CA',{hour:'2-digit',minute:'2-digit',hour12:false}) : '';
      showArrivalToast(d.psw_name || 'Your caregiver', timeStr);
    } catch {}
  });
  es.onerror = () => { es.close(); };
}

// ── Leaflet invalidateSize helper ──
function familyInvalidateMap() {
  ['_familyMap','_leafletMap','map'].forEach(k => {
    if (window[k] && typeof window[k].invalidateSize === 'function') {
      requestAnimationFrame(() => requestAnimationFrame(() => window[k].invalidateSize()));
    }
  });
}
</script>
