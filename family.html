     and applies Auto Dark Theme, which hue shifts the palette. That is why the
     green accent rendered blue on a real phone while the CSS was correct:
     --accent resolves to var(--rb-primary) which is #34D399. Declaring the
     scheme tells the browser the page is already dark and to leave it alone. -->

/* ── MOBILE RESET: Android overflow, box-sizing, safe-area ── */
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{overflow-x:clip;overflow-y:auto;overscroll-behavior-y:contain;
     -webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%}
html,body{overflow-x:clip}
body{overflow-x:clip;min-height:100vh;min-height:100dvh;margin:0;
     padding-bottom:calc(80px + env(safe-area-inset-bottom));
     -webkit-tap-highlight-color:transparent;overflow-wrap:anywhere;word-break:break-word}
img,picture,video,canvas,svg{max-width:100%;height:auto;display:block}
table{width:100%;max-width:100%;table-layout:fixed}
pre,code{max-width:100%;white-space:pre-wrap;word-break:break-word}
input,select,textarea,button{font:inherit;font-size:max(16px,1em);max-width:100%}
.map-wrapper{position:relative;width:100%;overflow:hidden}
.leaflet-container{width:100%!important;height:100%!important;max-width:100%}
/* ── END MOBILE RESET ── */


html,body{min-height:100vh;font-family:var(--sans),sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}

/* PIN GATE */
.gate-brand{font-family:'Inter',sans-serif;font-size:26px;font-weight:650;letter-spacing:-.3px;color:var(--text);text-align:center;margin-bottom:5px;}
.gate-sub{text-align:center;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:36px;}
.pin-btn:hover{background:var(--green-l);border-color:var(--accent);}
.pin-btn.del{font-size:16px;color:var(--muted);}
@keyframes pin-shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.gate-card.shake{animation:pin-shake 0.35s ease;}

/* APP */

/* TOPBAR */
.tb-brand{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal2);flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.tb-name{font-size:13px;color:var(--muted);font-weight:500;max-width:90px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* CONTENT */

/* STATUS CARD */
.status-card{background:rgba(30,122,72,.18);border:1px solid rgba(46,125,91,.35);border-radius:20px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden;}
.status-card.status-active{background:rgba(30,122,72,.22);border-color:rgba(46,160,100,.4);}
.status-card.status-complete{background:rgba(74,154,110,.06);border-color:rgba(74,154,110,.15);}
.status-card.status-none{background:var(--bg2);border-color:var(--border);}
.status-eyebrow{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:1;margin-bottom:8px;font-weight:500;color:#7dffb3;}
.status-name{font-family:'Inter',sans-serif;font-size:26px;font-weight:700;margin-bottom:4px;color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,.3);}
.status-detail{font-size:13px;opacity:1;color:rgba(200,240,215,.9);line-height:1.5;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.4;}}

textarea::placeholder,input::placeholder{color:rgba(184,207,212,.4);}

/* LOADING */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes map-pulse{0%,100%{box-shadow:0 0 0 3px rgba(74,154,110,.4),0 0 12px rgba(74,154,110,.6);}50%{box-shadow:0 0 0 6px rgba(74,154,110,.15),0 0 16px rgba(74,154,110,.4);}}

/* NAV */

/* SKELETON */
@keyframes fadeInDown{from{opacity:0;transform:translateX(-50%) translateY(-12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fam-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

button{transition:transform 50ms ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:active{transform:scale(0.98);}

/* ── FAMILY PORTAL DARK THEME NEW FEATURES ── */
.fam-alert-banner{margin:16px 16px 0;padding:12px 14px;border-radius:10px;}
.fam-alert-banner.info{background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);}
.fam-alert-banner.warn{background:rgba(224,154,61,.06);border:1px solid rgba(224,154,61,.2);}
.fam-alert-banner.crit{background:rgba(224,85,85,.06);border:1px solid rgba(224,85,85,.2);}
.fam-alert-lbl{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.fam-alert-lbl.info{color:var(--teal2);}
.fam-alert-lbl.warn{color:var(--amber);}
.fam-alert-lbl.crit{color:var(--red);}
.fam-alert-msg{font-size:15px;color:var(--muted2);line-height:1.6;}
/* Vitals row in visit detail */
.vitals-compact{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
.vitals-pill{font-family:var(--mono);font-size:14px;padding:4px 10px;border-radius:100px;background:var(--bg3);border:1px solid var(--border2);color:var(--muted2);}
.vitals-pill.ok{color:var(--teal2);border-color:rgba(52,211,153,.3);}
.vitals-pill.flag{color:var(--amber);border-color:rgba(224,154,61,.3);}
/* ETA banner */
.eta-banner{margin:12px 16px 0;padding:12px 14px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);border-radius:10px;display:flex;align-items:center;gap:10px;}
.eta-dot{width:8px;height:8px;border-radius:50%;background:var(--teal2);animation:livepulse 1.5s infinite;flex-shrink:0;}
@keyframes livepulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.eta-text{font-size:15px;color:var(--text);}
.eta-time{font-family:var(--mono);font-size:11px;color:var(--teal2);margin-top:2px;}
/* Care plan ack */
.care-ack-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:100px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.2);color:var(--teal2);margin-top:6px;}
/* Alert badges on client header */
.client-alert-chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:100px;border:1px solid;margin-right:4px;}
.client-alert-chip.fall{color:var(--amber);border-color:rgba(224,154,61,.3);}
.client-alert-chip.allergy{color:var(--red);border-color:rgba(224,85,85,.3);}
.client-alert-chip.env{color:#6dbdd4;border-color:rgba(255,255,255,.3);}
/* Section headers dark style */
.section-title{font-family:var(--mono);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

:root{
  /* ═══ SHARED DESIGN SYSTEM (matches index + all portals) ═══
     Structure/surfaces/type are shared across every Proximity surface.
     Per-portal identity: FAMILY = green primary. */
  --rb-void:#06080c; --rb-base:#0a0e14; --rb-panel:#0e131b;
  --rb-line:rgba(255,255,255,.07); --rb-line2:rgba(255,255,255,.13);
  --rb-text:#eef2f6; --rb-dim:#a6b3bf; --rb-faint:rgba(238,242,246,.62);
  --rb-primary:#34D399;        /* FAMILY identity = green */
  --rb-primary-bright:#5ce0a8;
  --rb-gold:#f0b549;
  --rb-serif:'Fraunces',serif; --rb-sans:'Space Grotesk',sans-serif; --rb-mono:'DM Mono',monospace;
  /* system color-map (shared across portals) */
  --sys-gps:#38bdf8; --sys-invoice:#fbbf24; --sys-family:#34d399;
  --sys-sched:#a78bfa; --sys-ai:#2dd4bf; --sys-lead:#fb7185;
  /* signature motion */
  --e:cubic-bezier(.22,1,.36,1); --e-snap:cubic-bezier(.34,1.56,.64,1);
  --t1:120ms; --t2:200ms; --t3:340ms; --t4:560ms;

  /* Legacy light tokens (kept for any stragglers) */
  --c-bg:#F7F8F5;
  --c-surface:#FFFFFF;
  --c-ink:#1B2A24;
  --c-ink-muted:#4B5A52;
  --c-good:#2E7D5B;
  --c-good-soft:#E4F1EA;
  --c-warn:#B26A00;
  --c-emergency:#B3261E;
  --fs-base:1.125rem;
  --fs-lg:1.375rem;
  --fs-xl:1.75rem;
  --lh-body:1.6;
  /* ── Core vars now MAPPED onto the shared system (every existing rule inherits) ── */
  --bg:var(--rb-void);
  --bg2:var(--rb-panel);
  --bg3:#151A21;
  --surface:var(--rb-panel);
  --border:var(--rb-line);
  --border2:var(--rb-line2);
  --text:var(--rb-text);
  --muted:var(--rb-dim);
  --muted2:var(--rb-dim);
  --accent:var(--rb-primary);
  --teal:var(--rb-primary);
  --teal2:var(--rb-primary);
  --teal3:var(--rb-primary);
  --gold:var(--rb-gold);
  --red:#e05555;
  --amber:#e09a3d;
  --green2:#4a9a6e;
  --mono:'DM Mono',monospace;
  --sans:var(--rb-sans);
  --serif:var(--rb-serif);
  /* --safe-bottom was USED at .nav-bar L641 and never defined. An undefined
     var makes max(6px,var(--safe-bottom)) invalid, so the browser dropped the
     WHOLE padding declaration and the bottom nav lost its safe area inset.
     Defined here to match the eight existing env(safe-area-inset-bottom) uses. */
  --safe-bottom:env(safe-area-inset-bottom);
  /* Legacy aliases */
  --success:#4a9a6e;
  --warning:#e09a3d;
  --error:#e05555;
  --green:#4a9a6e;
  --green-l:rgba(74,154,110,.1);
  --green-b:rgba(74,154,110,.2);
  --green-d:#2a6a4a;
  --shadow:rgba(0,0,0,.3);
}
/* PIN GATE */
.gate{position:fixed;inset:0;background:var(--surface);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.gate.hide{display:none;}
.gate-inner{width:100%;max-width:min(380px,calc(100vw - 40px));margin:0 auto;}
.gate-brand{font-family:'Inter',sans-serif;font-size:22px;font-weight:600;color:var(--text);text-align:center;margin-bottom:4px;}
.gate-brand em{color:var(--green);font-style:normal;}
.gate-sub{text-align:center;font-size:14px;color:var(--muted);margin-bottom:40px;}
.gate-card{background:var(--bg2);border-radius:22px;padding:34px 26px 26px;border:1px solid var(--border);}
.gate-hint{font-size:14px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.6;}
.pin-dots{display:flex;gap:16px;justify-content:center;margin-bottom:30px;}
.pin-dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--border2);transition:all .18s;}
.pin-dot.filled{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(52,211,153,.5);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center;}
.pin-btn{width:72px;height:72px;margin:0 auto;padding:0;border-radius:50%;border:1px solid var(--border2);background:rgba(255,255,255,.025);font-size:24px;font-weight:400;font-family:'Inter',sans-serif;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s,transform .12s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;}
.pin-btn:active{background:rgba(255,255,255,.07);border-color:var(--accent);transform:scale(.94);}
.pin-btn.del{color:var(--muted);}
.pin-btn.del svg{width:22px;height:22px;display:block;margin:0 auto;}
.pin-btn.empty{background:none;border:none;cursor:default;pointer-events:none;}
.pin-error{text-align:center;font-size:13px;color:var(--error);margin-top:14px;opacity:0;transition:opacity 0.2s;min-height:20px;}
.pin-error.show{opacity:1;}


/* APP */
.app{display:none;flex-direction:column;min-height:100vh;}
.app.show{display:flex;}

/* TOPBAR */
.topbar{background:rgba(7,9,12,.96);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.tb-brand{font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal2);}
.tb-brand em{color:var(--green);font-style:normal;}
.tb-right{display:flex;align-items:center;gap:10px;}
.tb-name{font-size:13px;color:var(--muted);font-weight:500;}
.tb-signout{background:none;border:none;font-size:12px;color:var(--muted);cursor:pointer;padding:6px 10px;border-radius:6px;font-family:'Inter',sans-serif;transition:color 0.15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.tb-signout:hover{color:var(--text);}

/* CONTENT */
.content{flex:1;padding:24px 20px;padding-bottom:calc(96px + env(safe-area-inset-bottom));max-width:min(560px,calc(100vw - 24px));margin:0 auto;width:100%;transition:opacity 150ms ease;}

/* STATUS CARD */
.status-card{background:var(--green);border-radius:20px;padding:28px 24px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden;}
.status-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);}
.status-eyebrow{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;opacity:0.65;margin-bottom:8px;font-weight:500;}
.status-name{font-family:'Inter',sans-serif;font-size:26px;font-weight:600;margin-bottom:4px;}
.status-detail{font-size:15px;opacity:0.8;line-height:1.5;}
.status-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.15);border-radius:100px;padding:5px 12px;font-size:12px;margin-top:14px;font-weight:500;}
.status-dot{width:6px;height:6px;border-radius:50%;background:#7dffb3;animation:pulse-dot 2s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* SECTION */
.section{margin-bottom:24px;}
.section-title{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;padding:0 2px;font-weight:600;}

/* CARDS */
.card{background:var(--bg2);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.card-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);transition:background .12s;}
.card-row:last-child{border:none;}
.card-row:hover{background:var(--surface);}
.card-row-label{font-size:13px;color:var(--muted);}
.card-row-value{font-size:14px;font-weight:500;text-align:right;color:var(--text);}
.card-row-value.green{color:var(--green);}

/* PSW CARD */
.psw-card{background:var(--bg2);border-radius:12px;padding:20px;border:1px solid var(--border);display:flex;align-items:center;gap:16px;margin-bottom:24px;transition:background 0.15s;}
.psw-card:hover{background:var(--surface);}
.psw-avatar{width:56px;height:56px;border-radius:50%;background:var(--green-l);border:2px solid var(--green-b);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:20px;color:var(--green);font-weight:600;flex-shrink:0;}
.psw-info{flex:1;}
.psw-name{font-size:16px;font-weight:600;margin-bottom:2px;color:var(--text);}
.psw-title{font-size:12px;color:var(--muted);}
.psw-schedule{font-size:12px;color:var(--accent);margin-top:4px;font-weight:500;}

/* VISIT ROWS */
.visit-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:12px;transition:background .12s;cursor:pointer;}
.visit-row:last-child{border:none;}
.visit-row:hover{background:var(--surface);}
.visit-date-box{width:44px;text-align:center;flex-shrink:0;}
.visit-date-day{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);font-weight:500;}
.visit-date-num{font-family:'Inter',sans-serif;font-size:22px;color:var(--text);line-height:1;font-weight:600;}
.visit-info{flex:1;}
.visit-psw{font-size:14px;font-weight:500;color:var(--text);}
.visit-time{font-size:12px;color:var(--muted);margin-top:2px;}
.visit-hours{font-size:15px;font-weight:600;color:var(--accent);}

/* DOCS */
.doc-row{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);gap:12px;text-decoration:none;color:inherit;transition:background 0.15s;}
.doc-row:last-child{border:none;}
.doc-row:hover{background:var(--surface);}
.doc-icon{width:36px;height:36px;border-radius:10px;background:var(--green-l);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--green);}
.doc-icon svg{width:18px;height:18px;}
.doc-info{flex:1;}
.doc-name{font-size:14px;font-weight:500;color:var(--text);}
.doc-type{font-size:12px;color:var(--muted);margin-top:1px;}
.doc-arrow{color:var(--muted);}
.doc-arrow svg{width:16px;height:16px;display:block;}

/* INVOICE ROWS */
.inv-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);transition:background 0.15s;}
.inv-row:last-child{border:none;}
.inv-row:hover{background:var(--surface);}
.inv-month{font-size:14px;font-weight:500;color:var(--text);}
.inv-right{text-align:right;}
.inv-amount{font-size:14px;font-weight:600;color:var(--accent);}
.inv-status{font-size:11px;color:var(--muted);margin-top:2px;}

/* MESSAGE THREAD */
.msg-thread-wrap{background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid var(--border);margin-bottom:24px;}
.msg-thread-body{padding:16px 20px;display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;}
.msg-bubble-out{background:var(--green);color:#fff;padding:10px 14px;border-radius:14px 14px 3px 14px;max-width:85%;margin-left:auto;font-size:13px;line-height:1.5;}
.msg-bubble-in{background:var(--surface);color:var(--text);padding:10px 14px;border-radius:14px 14px 14px 3px;max-width:85%;border:1px solid var(--border);font-size:13px;line-height:1.5;}
.msg-bubble-time{font-size:11px;opacity:.6;margin-top:3px;}
.msg-input-row{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--border);align-items:flex-end;}
.msg-input-field{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:16px;font-family:'Inter',sans-serif;color:var(--text);outline:none;resize:none;transition:border-color 0.15s;}
.msg-input-field:focus{border-color:var(--accent);}
.msg-send-btn{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;flex-shrink:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background 0.15s;}
.msg-send-btn:hover{background:var(--green-d);}
.msg-send-btn svg{width:18px;height:18px;}
.msg-char-count{font-size:11px;color:var(--muted);text-align:right;padding:0 20px 8px;font-family:'Inter',sans-serif;}
.msg-char-count.near{color:var(--warning);}
.msg-char-count.over{color:var(--error);}

/* VISIT DETAIL */
.visit-detail{padding:12px 20px 16px;border-top:1px solid var(--border);background:var(--surface);}
.visit-detail-lbl{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;margin-top:10px;font-weight:600;}
.visit-detail-val{font-size:15px;color:var(--text);line-height:1.6;}
.visit-expand-btn{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block;font-weight:500;}

/* UPCOMING */
.upcoming-row{display:flex;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);gap:12px;transition:background 0.15s;}
.upcoming-row:last-child{border:none;}
.upcoming-row:hover{background:var(--surface);}
.upcoming-date{width:40px;text-align:center;flex-shrink:0;}
.upcoming-date-dow{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;}
.upcoming-date-num{font-family:'Inter',sans-serif;font-size:20px;color:var(--text);line-height:1;font-weight:600;}
.upcoming-info{flex:1;}
.upcoming-psw{font-size:13px;font-weight:500;color:var(--text);}
.upcoming-time{font-size:15px;color:var(--muted);margin-top:2px;}
.upcoming-badge{font-size:11px;padding:3px 10px;border-radius:100px;background:var(--green-l);color:var(--green);font-weight:600;flex-shrink:0;}

/* CARE PLAN */
.plan-text{padding:20px;font-size:14px;color:var(--text);line-height:1.8;}

/* EMPTY STATES */
.empty-state{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.empty-state-icon{color:var(--muted);opacity:0.45;}
.empty-state-icon svg{width:48px;height:48px;}
.empty-state-title{font-size:16px;font-weight:500;color:var(--text);}
.empty-state-sub{font-size:14px;color:var(--muted);line-height:1.5;max-width:240px;}

/* LOADING */
.spinner{width:28px;height:28px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:320;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.nav-btn{flex:1;padding:12px 4px 14px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:'Inter',sans-serif;transition:color 0.15s;color:var(--muted);touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.nav-icon{display:flex;align-items:center;justify-content:center;color:var(--muted);transition:color 0.15s;}
.nav-label{font-size:11px;letter-spacing:0.02em;color:var(--muted);transition:color 0.15s;font-weight:500;}
.nav-btn.on .nav-label{color:var(--green);}
.nav-btn.on .nav-icon{color:var(--green);}

/* SATISFACTION STARS */
.visit-stars{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap;}
.visit-stars.rated{font-size:14px;color:#c8a040;letter-spacing:1px;}
.visit-stars.unrated .star-btn{background:none;border:none;font-size:18px;color:#c8d0c8;cursor:pointer;padding:0 1px;min-height:44px;min-width:28px;line-height:1;transition:color .15s;}
.visit-stars.unrated .star-btn:hover,.visit-stars.unrated .star-btn:focus{color:#c8a040;}
.stars-label{font-size:11px;color:var(--muted);letter-spacing:0.5px;margin-left:4px;}

/* SKELETON */
.skeleton-wrap{padding:24px 20px;}
.skeleton-block{border-radius:14px;background:linear-gradient(90deg,#f0f0f0 25%,#f8f8f8 50%,#f0f0f0 75%);background-size:200% 100%;animation:fam-shimmer 1.4s infinite;margin-bottom:14px;}
@keyframes fam-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.skeleton-status{height:120px;border-radius:20px;margin-bottom:24px;}
.skeleton-card-sm{height:80px;}
.skeleton-card-md{height:120px;}
.skeleton-card-lg{height:200px;}

button{transition:transform 50ms ease;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
button:active{transform:scale(0.98);}

/* ── VISIT MAP ── */
.map-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;color:var(--teal3);font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;margin-bottom:16px;transition:background .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

.map-btn svg{width:16px;height:16px;flex-shrink:0;}
.map-sheet-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.map-sheet-overlay.open{display:block;}
.map-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:20px 20px 0 0;max-height:88vh;z-index:301;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-width:100%;width:100%;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.map-sheet.open{transform:translateY(0);}
.map-sheet-drag{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:12px auto 0;}
.map-sheet-hdr{padding:12px 18px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.map-sheet-title{font-family:var(--mono);font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--teal3);}
.map-sheet-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px;min-height:44px;touch-action:manipulation;}
#visit-map{width:100%;height:340px;background:var(--bg3);border-bottom:1px solid var(--border);}
.map-legend{padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px;}
.map-legend-item{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px;}
.map-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.map-visit-list{padding:0 18px 12px;max-height:160px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}

.map-visit-ini.done{background:var(--bg3);border:1px solid var(--border2);color:var(--muted);}
.map-visit-info{flex:1;min-width:0;}
.map-visit-name{font-size:13px;font-weight:500;color:var(--text);}
.map-visit-time{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px;}
.map-visit-badge{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:100px;border:1px solid;flex-shrink:0;}
.map-visit-badge.active{color:var(--green);border-color:rgba(74,154,110,.4);background:rgba(74,154,110,.08);}

.upcoming-row,.card-row{flex-wrap:wrap;}

/* ── AF: VISITS ROW COMPACTION ──────────────────────────────────────
   .visit-action-btn was a full width block under every upcoming row:
   margin-top 8px plus min-height 38px is 46px per row, and with seven
   upcoming visits that is over 300px of button, about a third of a phone
   screen. The row already had an empty right hand column, which the past
   visit rows use for the hours figure, so the action moves there.

   Touch target stays at 44px through padding, not through height, so the
   row itself gets shorter while the tap area does not. */
.visit-action-link{
  flex-shrink:0; align-self:center;
  display:inline-flex; align-items:center; gap:4px;
  min-height:44px; padding:0 4px 0 10px;
  background:none; border:none; cursor:pointer;
  font-family:var(--rb-mono); font-size:10px; letter-spacing:.5px;
  text-transform:uppercase; color:var(--rb-primary);
  touch-action:manipulation; white-space:nowrap;
}
.visit-action-link:hover{ color:var(--rb-text); }
.visit-action-link:active{ opacity:.6; }

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, PREMIUM DEPTH (Pass 2: Home tab)              ║
   ║  CSS only. Elevates flat cards to gradient+glow+depth.        ║
   ║  Last-in-cascade: cleanly overrides duplicate class defs.    ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ── STATUS CARD, the emotional centerpiece ── */
.status-card{
  background:linear-gradient(160deg,var(--rb-panel),var(--rb-base))!important;
  border:1px solid var(--rb-line)!important; border-radius:20px!important;
  padding:26px 24px!important; position:relative; overflow:hidden;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.status-card::after{
  content:''!important; position:absolute!important; top:-40px; right:-40px;
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle, color-mix(in srgb,var(--rb-primary) 14%,transparent), transparent 70%)!important;
  pointer-events:none;
}
.status-card.status-active{
  border-color:color-mix(in srgb,var(--rb-primary) 32%,transparent)!important;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6), 0 0 0 1px color-mix(in srgb,var(--rb-primary) 12%,transparent),
             inset 0 1px 0 rgba(255,255,255,.04)!important;
}
.status-card.status-active::after{
  background:radial-gradient(circle, color-mix(in srgb,var(--rb-primary) 26%,transparent), transparent 70%)!important;
}
.status-card.status-complete{ border-color:color-mix(in srgb,var(--rb-primary) 18%,transparent)!important; }
.status-card.status-none::after{ display:none!important; }

.hero-status-line1{
  font-family:var(--rb-serif)!important; font-size:clamp(22px,6vw,30px)!important;
  font-weight:400!important; line-height:1.2!important; color:var(--rb-text)!important;
  margin:0 0 8px!important; letter-spacing:-.01em; max-width:100%; overflow-wrap:break-word;
}
.hero-status-line2{
  font-family:var(--rb-mono)!important; font-size:12px!important; color:var(--rb-dim)!important;
  line-height:1.5!important; letter-spacing:.3px; overflow-wrap:break-word;
}
.hero-status-dot{
  width:9px!important; height:9px!important; border-radius:50%!important;
  background:var(--rb-primary)!important; box-shadow:0 0 10px var(--rb-primary)!important;
  position:absolute!important; top:22px!important; right:22px!important;
}

/* ── CARDS, depth + hairline ── */
.card{
  background:linear-gradient(160deg,var(--rb-panel),var(--rb-base))!important;
  border:1px solid var(--rb-line)!important; border-radius:14px!important; overflow:hidden;
  box-shadow:0 12px 30px -18px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03)!important;
}

/* ── PSW / CARE-TEAM CARD, depth + hover lift + glow ring ── */
.psw-card{
  background:linear-gradient(160deg,var(--rb-panel),var(--rb-base))!important;
  border:1px solid var(--rb-line)!important; border-radius:14px!important;
  transition:transform var(--t2) var(--e), border-color var(--t2) var(--e), box-shadow var(--t2) var(--e)!important;
}
.psw-card:hover{
  transform:translateY(-2px); border-color:color-mix(in srgb,var(--rb-primary) 28%,transparent)!important;
  box-shadow:0 14px 34px -16px rgba(0,0,0,.55)!important;
}
.psw-avatar{
  background:color-mix(in srgb,var(--rb-primary) 14%,transparent)!important;
  border:1px solid color-mix(in srgb,var(--rb-primary) 32%,transparent)!important;
  color:var(--rb-primary)!important; font-family:var(--rb-sans)!important; font-weight:600!important;
  box-shadow:0 0 16px -4px color-mix(in srgb,var(--rb-primary) 40%,transparent)!important;
}
.psw-name{ font-family:var(--rb-sans)!important; color:var(--rb-text)!important; }
.psw-title{ font-family:var(--rb-mono)!important; color:var(--rb-dim)!important; font-size:11px!important; }

/* ── SECTION LABELS, premium mono voice ── */
.section-title{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:2px!important;
  text-transform:uppercase!important; color:var(--rb-faint)!important; font-weight:400!important;
  margin-bottom:12px!important;
}

/* ── MOBILE SAFETY: nothing wraps/warps/overlaps down to 320px ── */
@media(max-width:380px){
  .status-card{ padding:22px 18px!important; }
  .hero-status-line1{ font-size:clamp(20px,5.6vw,26px)!important; }
  .psw-card{ padding:16px!important; gap:12px!important; }
}

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, VISITS TAB DEPTH (Pass 3)                     ║
   ║  CSS only. AI care summary = hero moment. Vitals/meds = chips. ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ── VISIT ROW, tactile, depth on hover ── */
.visit-row{
  padding:15px 18px!important; gap:14px!important;
  transition:background var(--t2) var(--e)!important;
}
.visit-row:hover{ background:rgba(255,255,255,.025)!important; }

/* ── DATE BOX, recessed chip, serif number ── */
.visit-date-box{
  width:46px!important; flex-shrink:0!important; padding:7px 0!important; border-radius:10px!important;
  background:#06090e!important; border:1px solid var(--rb-line)!important;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5)!important;
}
.visit-date-day{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:1px!important;
  color:var(--rb-primary)!important; text-transform:uppercase!important; font-weight:400!important;
}
.visit-date-num{
  font-family:var(--rb-serif)!important; font-size:22px!important; font-weight:400!important;
  color:var(--rb-text)!important; line-height:1!important; margin-top:1px;
}
.visit-psw{ font-family:var(--rb-sans)!important; color:var(--rb-text)!important; font-weight:500!important; }
.visit-time{ font-family:var(--rb-mono)!important; color:var(--rb-dim)!important; font-size:11px!important; }
.visit-hours{ font-family:var(--rb-mono)!important; color:var(--rb-primary)!important; font-size:14px!important; font-weight:500!important; flex-shrink:0; }
.visit-expand-btn{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:.5px!important;
  color:var(--rb-primary)!important; text-decoration:none!important; text-transform:uppercase;
  margin-top:5px!important;
}

/* ── DETAIL PANEL, recessed readout screen ── */
.visit-detail{
  padding:16px 18px 18px!important; border-top:1px solid var(--rb-line)!important;
  background:radial-gradient(ellipse at 50% 0%, color-mix(in srgb,var(--rb-primary) 5%,transparent), transparent 60%), #06090e!important;
}
.visit-detail-lbl{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:1.5px!important;
  text-transform:uppercase!important; color:var(--rb-faint)!important; font-weight:400!important;
  margin:14px 0 5px!important;
}
.visit-detail-lbl:first-child{ margin-top:0!important; }
.visit-detail-val{ font-family:var(--rb-sans)!important; font-size:14px!important; color:var(--rb-text)!important; line-height:1.6!important; }

/* ── AI CARE SUMMARY = HERO MOMENT (first lbl+val in detail) ── */
.visit-detail .visit-detail-lbl:first-child{
  color:var(--rb-primary)!important; display:flex; align-items:center; gap:6px;
}
.visit-detail .visit-detail-lbl:first-child::before{
  content:''; width:5px; height:5px; border-radius:50%; background:var(--rb-primary);
  box-shadow:0 0 6px var(--rb-primary); display:inline-block;
}
.visit-detail .visit-detail-lbl:first-child + .visit-detail-val{
  background:color-mix(in srgb,var(--rb-primary) 7%,transparent)!important;
  border:1px solid color-mix(in srgb,var(--rb-primary) 20%,transparent)!important;
  border-radius:10px!important; padding:12px 14px!important; margin-top:2px;
  font-size:14px!important; color:var(--rb-text)!important;
}

/* ── VITALS, health-data chips ── */
.vitals-compact{ display:flex!important; flex-wrap:wrap!important; gap:7px!important; margin-top:8px!important; }
.vitals-compact > *{
  font-family:var(--rb-mono)!important; font-size:11px!important;
  background:color-mix(in srgb,var(--sys-gps) 10%,transparent)!important;
  border:1px solid color-mix(in srgb,var(--sys-gps) 25%,transparent)!important;
  color:var(--rb-text)!important; padding:4px 10px!important; border-radius:8px!important; white-space:nowrap;
}

/* ── STARS ── */
.visit-stars.rated{ color:var(--rb-gold)!important; }
.stars-label{ font-family:var(--rb-mono)!important; font-size:10px!important; color:var(--rb-faint)!important; letter-spacing:.5px; }
.visit-stars.unrated .star-btn:hover,.visit-stars.unrated .star-btn:focus{ color:var(--rb-gold)!important; }

/* ── MOBILE SAFETY, visits down to 320px ── */
@media(max-width:380px){
  .visit-row{ padding:13px 14px!important; gap:11px!important; }
  .visit-date-box{ width:42px!important; }
  .visit-detail{ padding:14px!important; }
  .vitals-compact > *{ font-size:10px!important; padding:3px 8px!important; }
}

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, CARE TAB DEPTH (Pass 4)                       ║
   ║  CSS only. Plan reads beautifully; schedule matches visits.   ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ── CARE PLAN BODY ── */
.plan-text{
  font-family:var(--rb-sans)!important; font-size:14px!important; color:var(--rb-text)!important;
  line-height:1.75!important; padding:20px!important;
}

/* ── CARD ROWS (contact, fallback schedule) ── */
.card-row{ padding:14px 18px!important; border-bottom:1px solid var(--rb-line)!important; transition:background var(--t2) var(--e)!important; }
.card-row:hover{ background:rgba(255,255,255,.02)!important; }
.card-row-label{ font-family:var(--rb-mono)!important; font-size:14px!important; letter-spacing:.5px; color:var(--rb-dim)!important; }
.card-row-value{ font-family:var(--rb-sans)!important; font-size:14px!important; color:var(--rb-text)!important; font-weight:500!important; }
.card-row-value.green{ color:var(--rb-primary)!important; }

/* ── UPCOMING SCHEDULE, match the visits date-chip treatment ── */
.upcoming-row{ padding:15px 18px!important; gap:14px!important; transition:background var(--t2) var(--e)!important; }
.upcoming-row:hover{ background:rgba(255,255,255,.025)!important; }
.upcoming-date{
  width:46px!important; flex-shrink:0!important; padding:7px 0!important; border-radius:10px!important;
  background:#06090e!important; border:1px solid var(--rb-line)!important;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.5)!important;
}
.upcoming-date-dow{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:1px!important;
  color:var(--rb-primary)!important; text-transform:uppercase!important; font-weight:400!important;
}
.upcoming-date-num{
  font-family:var(--rb-serif)!important; font-size:22px!important; font-weight:400!important;
  color:var(--rb-text)!important; line-height:1!important; margin-top:1px;
}
.upcoming-info{ flex:1!important; min-width:0!important; }
.upcoming-psw{ font-family:var(--rb-sans)!important; font-size:14px!important; color:var(--rb-text)!important; font-weight:500!important;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.upcoming-time{ font-family:var(--rb-mono)!important; font-size:14px!important; color:var(--rb-dim)!important; margin-top:2px!important; }
.upcoming-badge{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:1px!important; text-transform:uppercase!important;
  padding:4px 10px!important; border-radius:100px!important;
  background:color-mix(in srgb,var(--rb-primary) 12%,transparent)!important;
  border:1px solid color-mix(in srgb,var(--rb-primary) 28%,transparent)!important;
  color:var(--rb-primary)!important; font-weight:400!important; flex-shrink:0!important;
}

/* ── MOBILE SAFETY, care tab down to 320px ── */
@media(max-width:380px){
  .plan-text{ padding:16px!important; }
  .card-row{ padding:13px 14px!important; }
  .upcoming-row{ padding:13px 14px!important; gap:11px!important; }
  .upcoming-date{ width:42px!important; }
  .card-row-label,.card-row-value{ font-size:13px!important; }
}

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, ASK + BILLING DEPTH (Pass 5)                  ║
   ║  CSS only. Invoices = receipt feel. Ask chat tactile.         ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ── INVOICE ROWS, receipt feel (echoes index pricing) ── */
.inv-row{ padding:16px 18px!important; border-bottom:1px solid var(--rb-line)!important; transition:background var(--t2) var(--e)!important; }
.inv-row:hover{ background:rgba(255,255,255,.025)!important; }
.inv-month{ font-family:var(--rb-sans)!important; font-size:14px!important; color:var(--rb-text)!important; font-weight:500!important; }
.inv-amount{
  font-family:var(--rb-serif)!important; font-size:22px!important; font-weight:400!important;
  color:var(--rb-primary)!important; line-height:1; font-variant-numeric:tabular-nums;
}
.inv-status{
  font-family:var(--rb-mono)!important; font-size:10px!important; letter-spacing:1px!important;
  text-transform:uppercase!important; color:var(--rb-faint)!important; margin-top:4px!important;
}
.inv-row .inv-month + div{ font-family:var(--rb-mono)!important; }

/* ── ASK CHAT, tactile suggested chips + send buttons ── */
#ask-msgs > div{ font-family:var(--rb-sans)!important; }
#ask-input,#coord-msg-input,#private-note-input,#feedback-psw-select{
  font-family:var(--rb-sans)!important;
  background:#06090e!important; border:1px solid var(--rb-line)!important;
}
#ask-input:focus,#coord-msg-input:focus{ border-color:color-mix(in srgb,var(--rb-primary) 35%,transparent)!important; outline:none!important; }

/* ── MOBILE SAFETY, ask + billing down to 320px ── */
@media(max-width:380px){
  .inv-row{ padding:14px!important; }
  .inv-amount{ font-size:20px!important; }
}

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, ACCESS + FINAL SWEEP (Pass 6)                 ║
   ║  CSS only. Gate, nav, topbar, access log → premium depth.     ║
   ║  Completes the portal: every surface now has depth.           ║
   ╚═══════════════════════════════════════════════════════════════╝ */

/* ── PIN GATE, the first impression ── */
/* ── GATE: matched to PSW lockscreen quality, cardless, centered, round keys ── */
.gate-card{
  background:transparent!important; border:none!important; box-shadow:none!important;
  padding:0!important; border-radius:0!important;
}
.gate-inner{ max-width:min(360px,calc(100vw - 40px))!important; }
.gate-brand{ font-family:var(--rb-mono)!important; font-size:11px!important; letter-spacing:3px!important;
  text-transform:uppercase!important; color:var(--rb-dim)!important; font-weight:400!important; margin-bottom:6px!important; }
.gate-brand em{ color:var(--rb-primary)!important; font-style:normal!important; }
.gate-sub{ font-family:var(--rb-mono)!important; color:var(--rb-faint)!important; letter-spacing:3px!important;
  font-size:11px!important; text-transform:uppercase!important; margin-bottom:26px!important; }
.gate-hint{ font-family:var(--rb-sans)!important; color:var(--rb-dim)!important; font-size:14px!important;
  line-height:1.6!important; text-align:center!important; margin-bottom:26px!important; }
.gate-help{ text-align:center; font-family:var(--rb-mono); font-size:10px; letter-spacing:1px; color:var(--rb-faint); margin-top:18px; line-height:1.5; }
.pin-error{ min-height:20px!important; margin-top:14px!important; font-size:12px!important; }
/* PIN dots, glow when filled */
.pin-dots{ gap:16px!important; margin-bottom:28px!important; }
.pin-dot{ width:13px!important; height:13px!important; border:1.5px solid var(--rb-line2)!important; }
.pin-dot.filled{
  background:var(--rb-primary)!important; border-color:var(--rb-primary)!important;
  box-shadow:0 0 14px color-mix(in srgb,var(--rb-primary) 65%,transparent)!important;
}
/* ROUND keys, iOS passcode style, like PSW .lock-key (the big upgrade) */
.pin-pad{ grid-template-columns:repeat(3,72px)!important; gap:14px!important; justify-content:center!important; }
.pin-btn{
  width:72px!important; height:72px!important; border-radius:50%!important; padding:0!important;
  background:linear-gradient(160deg,#161d28,#0d1218)!important;
  border:1px solid var(--rb-line2)!important;
  color:var(--rb-text)!important; font-family:var(--rb-sans)!important; font-weight:300!important; font-size:26px!important;
  box-shadow:0 4px 14px -5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05)!important;
  transition:transform var(--t1) var(--e), border-color var(--t1) var(--e), box-shadow var(--t1) var(--e)!important;
}
.pin-btn:hover{
  border-color:color-mix(in srgb,var(--rb-primary) 30%,transparent)!important;
  box-shadow:0 6px 18px -5px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08)!important;
}
.pin-btn:active{
  background:radial-gradient(circle, color-mix(in srgb,var(--rb-primary) 24%,#161d28), color-mix(in srgb,var(--rb-primary) 8%,#0d1218))!important;
  border-color:color-mix(in srgb,var(--rb-primary) 55%,transparent)!important;
  box-shadow:0 0 26px -4px color-mix(in srgb,var(--rb-primary) 55%,transparent), inset 0 1px 0 rgba(255,255,255,.08)!important;
  transform:scale(.93)!important;
}
.pin-btn.empty{ background:none!important; border:none!important; box-shadow:none!important; }
.pin-btn.del{ color:var(--rb-dim)!important; }

/* ── NAV BAR, active glow ── */
.nav-btn.on .nav-label{ color:var(--rb-primary)!important; }
.nav-btn.on .nav-icon{ color:var(--rb-primary)!important; filter:drop-shadow(0 0 6px color-mix(in srgb,var(--rb-primary) 60%,transparent)); }
.nav-btn{ font-family:var(--rb-sans)!important; }

/* ── TOPBAR ── */
.tb-brand{ font-family:var(--rb-mono)!important; color:var(--rb-primary)!important; }
.tb-brand em{ color:var(--rb-primary)!important; font-style:normal!important; }

/* ── ACCESS LOG, depth rows ── */
#access-log-list > div{ transition:background var(--t2) var(--e); }
#access-log-list > div:hover{ background:rgba(255,255,255,.02); }

/* ── SKELETON LOADERS, match dark panels ── */
.skeleton-block{
  background:linear-gradient(90deg,var(--rb-panel) 25%,var(--rb-base) 50%,var(--rb-panel) 75%)!important;
  background-size:200% 100%!important; border:1px solid var(--rb-line)!important;
}

/* ── FINAL CONSISTENCY: any stray flat surface picks up depth ── */
.section-title{ color:var(--rb-faint)!important; }

/* ╔═══════════════════════════════════════════════════════════════╗
   ║  FAMILY PORTAL, DENSITY FIX (Pass A)                          ║
   ║  Kills compounding dead space. Composed, full, not scattered. ║
   ╚═══════════════════════════════════════════════════════════════╝ */
.content{ padding:16px 16px!important; padding-bottom:calc(92px + env(safe-area-inset-bottom))!important; }
.section{ margin-bottom:16px!important; }
.section-title{ margin-bottom:9px!important; font-size:10px!important; letter-spacing:1.5px!important; }
.card{ border-radius:14px!important; }
.card-row{ padding:13px 16px!important; }
.plan-text{ padding:16px!important; line-height:1.65!important; }
.visit-row{ padding:13px 16px!important; }
.visit-detail{ padding:14px 16px 16px!important; }
.upcoming-row{ padding:13px 16px!important; }
.inv-row{ padding:14px 16px!important; }
.psw-card{ padding:16px!important; }
/* status card, tighten a touch, it was very tall */
.status-card{ padding:22px 20px!important; }
/* section-title to first card, pull closer */
.section-title + .card,.section-title + div > .card{ margin-top:0!important; }
@media(max-width:380px){
  .content{ padding:14px 13px!important; }
  .section{ margin-bottom:14px!important; }
}

/* ╔═══ FAMILY PORTAL, PHOTOS (Pass B): grouped + lightbox ═══╗ */
.photo-groups{ display:flex; flex-direction:column; gap:8px; }
.photo-group{ background:linear-gradient(160deg,var(--rb-panel),var(--rb-base)); border:1px solid var(--rb-line);
  border-radius:12px; overflow:hidden; }
.photo-group-head{ width:100%; display:flex; align-items:center; gap:10px; padding:13px 16px;
  background:none; border:none; cursor:pointer; text-align:left; touch-action:manipulation; min-height:48px; }
.pg-date{ font-family:var(--rb-sans); font-size:13px; color:var(--rb-text); font-weight:500; flex:1; }
.pg-count{ font-family:var(--rb-mono); font-size:10px; letter-spacing:.5px; text-transform:uppercase; color:var(--rb-primary); }
.pg-chev{ font-size:10px; color:var(--rb-dim); width:14px; text-align:center; }
.photo-group-body{ display:none; padding:0 12px 12px; }
.photo-group-body.open{ display:block; }
.photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.photo-cell{ aspect-ratio:1; overflow:hidden; border-radius:8px; border:none; padding:0; cursor:pointer;
  background:#06090e; touch-action:manipulation; }
.photo-cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform var(--t2) var(--e); }
.photo-cell:hover img{ transform:scale(1.05); }
/* lightbox */
#fam-lightbox{ position:fixed; inset:0; z-index:2000; background:rgba(3,5,8,.95);
  display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px); }
#fam-lightbox.open{ display:flex; }
#fam-lightbox img{ max-width:100%; max-height:90vh; border-radius:12px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.8); }
.lb-close{ position:fixed; top:calc(16px + env(safe-area-inset-top)); right:18px; width:44px; height:44px;
  border-radius:50%; background:rgba(255,255,255,.1); border:1px solid var(--rb-line2); color:#fff;
  font-size:18px; cursor:pointer; touch-action:manipulation; display:flex; align-items:center; justify-content:center; }

/* ╔═══ FAMILY, SCHEDULE WORKFLOW (reschedule / pause / resume) ═══╗ */
.care-pause-banner{ width:100%; display:flex; align-items:center; gap:14px; padding:15px 16px;
  background:linear-gradient(160deg,var(--rb-panel),var(--rb-base)); border:1px solid var(--rb-line);
  border-radius:14px; cursor:pointer; text-align:left; touch-action:manipulation; min-height:60px;
  box-shadow:0 12px 30px -18px rgba(0,0,0,.5); transition:border-color var(--t2) var(--e); }
.care-pause-banner:hover{ border-color:color-mix(in srgb,var(--rb-primary) 28%,transparent); }
.cpb-icon{ font-size:22px; flex-shrink:0; }
.cpb-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.cpb-text strong{ font-family:var(--rb-sans); font-size:14px; color:var(--rb-text); font-weight:600; }
.cpb-text span{ font-family:var(--rb-mono); font-size:10px; letter-spacing:.5px; color:var(--rb-dim); }
.cpb-chev{ font-size:22px; color:var(--rb-dim); flex-shrink:0; }
/* bottom sheet */
#sched-sheet{ position:fixed; inset:0; z-index:2100; display:none; }
#sched-sheet.open{ display:block; }
.sched-backdrop{ position:absolute; inset:0; background:rgba(3,5,8,.7); backdrop-filter:blur(3px); }
.sched-panel{ position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto;
  background:linear-gradient(180deg,var(--rb-panel),var(--rb-base)); border-top:1px solid var(--rb-line2);
  border-radius:22px 22px 0 0; padding:24px 20px calc(28px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.7); animation:schedUp .28s var(--e); }
@keyframes schedUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.sched-sheet-title{ font-family:var(--rb-serif); font-size:24px; font-weight:400; color:var(--rb-text); margin-bottom:4px; }
.sched-sheet-sub{ font-family:var(--rb-mono); font-size:11px; letter-spacing:.5px; color:var(--rb-dim); margin-bottom:20px; }
.sched-opt{ width:100%; display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:10px;
  background:#06090e; border:1px solid var(--rb-line); border-radius:14px; cursor:pointer; text-align:left;
  touch-action:manipulation; min-height:64px; transition:border-color var(--t2) var(--e); }

  color:var(--rb-primary); font-size:30px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 30px -6px color-mix(in srgb,var(--rb-primary) 50%,transparent); }

/* ── AF3: DESKTOP ────────────────────────────────────────────────────
   This portal had ZERO min-width rules, so it was a phone layout stretched
   to whatever the monitor was. HQ has six min-width breakpoints and swaps
   its bottom nav for a sidebar at 900px, which is right for ten sections
   used daily, and heavier than a six tab portal a family opens for a
   minute needs.

   So the nav stays at the bottom and is constrained to the same reading
   column as the content, which AF2 restored to 560px. On a phone nothing
   changes, this block never applies below 900px. On a monitor the bar
   stops spanning the full width and reads as part of the page.

   Deliberately NOT moving the nav under the header: that needs
   position:fixed with a top offset matched to the topbar height, and the
   topbar height is set by its own padding rather than a fixed value. Two
   coupled measurements that cannot be verified without rendering it. */
/* B36. THE FAMILY PORTAL WASTED THE DESKTOP.
   .content is capped at min(560px, 100vw - 24px) at EVERY width, so a 1440px
   window showed a 560px column and 880px of empty margin. There was already a
   @media(min-width:900px) block, but it only centred the bottom nav to match.

   WHY THE PSW PORTAL DOES NOT DO THIS. It has no .content cap at all and uses
   grid-template-columns in eight places, so it reflows into whatever space it
   is given. Same principle as B35: a phone-shaped constraint applied at every
   width is the bug, not the width itself.

   HOW THIS ADAPTS WITHOUT A CHOSEN BREAKPOINT. repeat(auto-fit, minmax(...))
   lets the BROWSER decide how many columns fit. min(100%, 420px) means a
   column never demands more than the container has, so on a phone it stays
   exactly one column and every existing mobile rule still applies untouched.
   Two columns appear only when 840px of content plus the gap genuinely fit.

     390px   1 column, identical to today
     768px   1 column, untouched
     911px   1 column, untouched
     912px   2 columns of exactly 420px
     1440px  2 columns inside a 1200px cap, margins are deliberate whitespace
             rather than 880px of nothing

   THE 912px IS DERIVED, NOT CHOSEN. Two 420px columns plus a 24px gap need an
   864px container, and the container is 100vw minus 48px of padding, so two
   columns first fit at exactly 912px. My first attempt used a round 900px and
   produced ONE column 852px wide, which is worse reading than the 560px it
   replaced. Modelling it caught that before it shipped.

   align-items:start stops a short card stretching to match a tall neighbour,
   which is what makes an auto-fit grid look broken when it is not.

   NOT A REWRITE. showTab rewrites #contentArea as a flat run of .section
   blocks, which is exactly what a grid reflows. .section is margin only and
   .card is a plain box, so nothing positioned or floated is disturbed. */
@media(min-width:912px){
  .content{
    max-width:min(1200px, calc(100vw - 48px));
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(min(100%, 420px), 1fr));
    gap:0 24px;
    align-items:start;
  }
  /* The scheduling sheet is anchored to the viewport, not to the grid, so it
     keeps its own 560px reading width rather than stretching to 1200px. */
  .sched-panel{max-width:560px;}

  /* B42. THE LOPSIDED LOWER HALF, measured after V49: RECENT VISITS 453px in
     column 1 beside CARE TEAM 137px in column 2, leaving ~320px dead under the
     team card, then the coordinator card started a lonely row on the LEFT with
     the right side empty to the bottom.

     grid-column:2 on the coordinator ALONE would only mirror the problem: it
     lands in the next free row of column 2, and column 1 goes empty instead.
     The pair below is what balances it. RECENT VISITS spans two rows, so the
     row beside it splits: CARE TEAM in the first, the coordinator directly
     under it in the second, and the tall card's height is absorbed across
     both instead of padding one.

     WHY grid-column:2 IS SAFE HERE, derived not hoped: two columns need
     420*2+24 = 864px of content, content is min(1200px, 100vw-48px), and
     inside this block 100vw is at least 912px, so content is at least 864px.
     auto-fit therefore ALWAYS yields two columns everywhere this rule can
     apply, and a phantom third column cannot exist.

     MOBILE IS UNTOUCHED. Both rules live inside this media block, and the two
     ids added to the template render inert below 912px. DOM order is
     unchanged, which was B36's whole constraint. */
  #recent-visits-section{grid-row:span 2;}
  #coordinator-section{grid-column:2;}
}
@media(min-width:900px){
  .bottom-nav{
    left:50%; right:auto;
    transform:translateX(-50%);
    width:min(560px, calc(100vw - 24px));
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:16px 16px 0 0;
    overflow:hidden;
  }
  /* The bar is 8px shorter without the safe area inset a phone needs, so
     the content padding comes back by the same amount rather than being
     guessed at. */
  .content{ padding-bottom:88px; }
}

<script>
const R = 'https://proximity-agent-production.up.railway.app'

// ── C1: Supabase Realtime client (anon key, read-only, safe for client) ──
// Populated after PIN verify, server returns supabase config securely
let   SUPA_URL    = '';
let   SUPA_ANON   = '';
let   _supaClient = null;
let   _realtimeCh = null;   // active channel ref for cleanup

function getSupaClient() {
  if (!SUPA_URL || !SUPA_ANON) return null;
  if (!_supaClient) {
    _supaClient = window.supabase?.createClient(SUPA_URL, SUPA_ANON, {
      realtime: { params: { eventsPerSecond: 2 } }
    });
  }
  return _supaClient;
};

// ── XSS GUARD ──
function starSVG(filled){
  return filled
    ? '<svg viewBox="0 0 24 24" class="star-svg" style="width:1em;height:1em;vertical-align:-0.12em;"><path fill="currentColor" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>'
    : '<svg viewBox="0 0 24 24" class="star-svg" style="width:1em;height:1em;vertical-align:-0.12em;"><path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>';
}
function starsRow(rated){
  var s=''; for(var i=1;i<=5;i++) s+=starSVG(i<=rated); return s;
}
function escHtml(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
let slug = '', pinVal = '', portalData = null, clientSlug = '';
let famVisitRange = 'month';
let famCustomFrom = '';
let famCustomTo = '';

/* AB3: the family PIN is validated once at /family/verify-pin and then never
   sent again, so every data route has been reachable by slug alone. The slug is
   not a secret: the twelve clients imported in April have slugs of the form
   first initial plus surname.

   These helpers send the PIN the portal already holds. Declared here in the
   globals rather than beside the first caller, because five functions above and
   below use them and a const below its consumer is a temporal dead zone.

   Reads pinVal first, then sessionStorage, so a reload that restored the PIN
   into storage but not yet into the global still works. */
const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
function fmtMonth(m) {
  const i = Number(m);
  return (Number.isInteger(i) && i >= 1 && i <= 12) ? MONTH_NAMES[i - 1] : (m == null ? '' : String(m));
}

/* AE2: task_photos holds either a legacy full public URL, written before the
   photo route existed, or a bare storage path, written after. Both resolve to
   the same object, so strip everything up to the bucket marker and hand the
   path to the signed photo route.

   The bucket is private on purpose. These are photographs taken inside a
   client's home, and a permanent public object URL would be readable by anyone
   who ever saw the link. The route checks the PIN and confirms the photo
   belongs to this client before signing it for 300 seconds. */
function famPhotoPath(u) {
  if (!u) return '';
  const marker = '/visit-photos/';
  const s = String(u);
  const i = s.indexOf(marker);
  return i >= 0 ? s.slice(i + marker.length) : s;
}

function famPhotoUrl(u) {
  const p = famPhotoPath(u);
  if (!p) return '';
  const s = slug || clientSlug || '';
  return `${R}/family/visit-photo/${encodeURIComponent(s)}?pin=${encodeURIComponent(famPin())}&path=${encodeURIComponent(p)}`;
}

function famPin() {
  const s = slug || clientSlug || '';
  try { return pinVal || sessionStorage.getItem('family_pin_' + s) || ''; }
  catch (e) { return pinVal || ''; }
}

/* Appends the pin as a query param. GET routes cannot carry a body, and the SSE
   call in this file already uses this exact shape, so this is consistent with
   what the portal does today rather than a new convention. */
// VE2. showToast was CALLED NINE TIMES IN THIS FILE AND NEVER DEFINED.
//
// It is absent from the deployed version too, so this has been live for some
// time. Every call threw a ReferenceError, and because each sits at the TOP of
// a try block, the throw was swallowed by the catch.
//
// So a family tapping "Download care plan" got NOTHING. No PDF, no error, no
// spinner. The same failure shape as the photos: something that looks like
// nothing happening.
//
// Self contained on purpose. It creates its own element on first use, so it
// cannot depend on markup that may not be present on every screen.
function showToast(msg, kind) {
  try {
    let el = document.getElementById('fam-toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'fam-toast';
      el.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);'
        + 'bottom:calc(84px + var(--safe-bottom,0px));z-index:9999;max-width:88%;'
        + 'padding:12px 18px;border-radius:10px;font-size:14px;line-height:1.5;'
        + 'text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.18);'
        + 'opacity:0;transition:opacity .18s ease;pointer-events:none;';
      document.body.appendChild(el);
    }
    const err = kind === 'err';
    el.style.background = err ? '#7a2718' : '#1e5c43';
    el.style.color = '#fff';
    el.textContent = String(msg == null ? '' : msg);
    // Force a reflow so the transition runs when the same element is reused.
    void el.offsetWidth;
    el.style.opacity = '1';
    clearTimeout(el._t);
    // Errors linger, because a family needs time to read what went wrong.
    el._t = setTimeout(() => { el.style.opacity = '0'; }, err ? 4200 : 2600);
  } catch (e) {
    // Never let a toast break the action it was reporting on.
  }
}

function famUrl(path) {
  return `${R}${path}${path.includes('?') ? '&' : '?'}pin=${encodeURIComponent(famPin())}`;
}

/* A 401 means the PIN is wrong or the session is stale. signOut() already
   clears the stored PIN and returns to the lock screen using the class based
   show and hide this file uses. My first version set inline display styles,
   which would not have worked because the gate is toggled by class. */
function famHandle401(res) {
  if (!res || res.status !== 401) return false;
  if (typeof signOut === 'function') signOut();
  return true;
}

const params = new URLSearchParams(window.location.search);
slug = params.get('c') || params.get('slug') || ''; clientSlug = slug;

// ── PIN LOGIC ──
function pinPress(d) {
  if (pinVal.length >= 4) return;
  pinVal += d;
  updateDots();
  if (pinVal.length === 4) setTimeout(verifyPin, 200);
}

function pinDel() {
  pinVal = pinVal.slice(0, -1);
  updateDots();
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < pinVal.length);
  }
}

async function verifyPin() {
  try {
    const r = await fetch(`${R}/family/verify-pin`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, pin: pinVal })
    });
    const d = await r.json();
    if (d.success) {
      try { sessionStorage.setItem('family_pin_' + slug, pinVal); } catch(e) {}
      // C1: Store supabase config from server response
      if (d.supabase) { SUPA_URL = d.supabase.url || ''; SUPA_ANON = d.supabase.anon_key || ''; }
      document.getElementById('gate').classList.add('hide');
      document.getElementById('app').classList.add('show');
      document.getElementById('tbName').textContent = d.client.first_name + ' ' + d.client.last_name;
      loadPortal();
      setTimeout(requestPushPermission, 2000);
    } else {
      showPinError();
    }
  } catch (e) {
    showPinError();
  }
}

function showPinError() {
  document.getElementById('pinError').classList.add('show');
  const card = document.getElementById('gateCard');
  if ('vibrate' in navigator) { try { navigator.vibrate([40,60,40]); } catch {} }
  card.classList.remove('shake');
  void card.offsetWidth;
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 400);
  pinVal = '';
  updateDots();
  setTimeout(() => document.getElementById('pinError').classList.remove('show'), 2500);
}

function signOut() {
  try { sessionStorage.removeItem('family_pin_' + slug); } catch(e) {}
  pinVal = '';
  updateDots();
  portalData = null;
  document.getElementById('gate').classList.remove('hide');
  document.getElementById('app').classList.remove('show');
}

// ── LOAD PORTAL ──

// ── ETA BANNER, shows when PSW is en route ──
async function downloadInvoice(invoiceId, btn) {
  const original = btn ? btn.textContent : '';
  if (btn) { btn.textContent = 'Opening'; btn.disabled = true; }
  try {
    const r = await fetch(famUrl(`/family/invoice/${clientSlug || slug}/${invoiceId}/download`));
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.success && d.url) {
      window.open(d.url, '_blank');
    } else {
      showLiveToast(d.error || 'Invoice is not available right now', 'departure');
    }
  } catch {
    showLiveToast('Could not open the invoice. Please try again', 'departure');
  }
  if (btn) { btn.textContent = original || 'Download'; btn.disabled = false; }
}

let _etaTicker = null, _etaTargetMs = null;
function _fmtEtaCountdown() {
  if (!_etaTargetMs) return '';
  const mins = Math.round((_etaTargetMs - Date.now()) / 60000);
  if (mins > 1) return 'Arriving in about ' + mins + ' min';
  if (mins >= 0) return 'Arriving any moment';
  return 'Arriving soon';
}
async function loadETABanner() {
  try {
    if (!clientSlug) return;
    const banner = document.getElementById('eta-banner');
    const etaText = document.getElementById('eta-text');
    const etaTime = document.getElementById('eta-time');
    if (!banner) return;
    const r = await fetch(famUrl(`/family/portal/${clientSlug}`));
    if (famHandle401(r)) return;
    if (!r.ok) return;
    const d = await r.json();
    const tv = d.today_visit || (d.visits || []).find(v => v.visit_stage === 'en_route' || v.visit_stage === 'running_late');
    const stage = tv && tv.visit_stage;
    const stopTicker = () => { if (_etaTicker) { clearInterval(_etaTicker); _etaTicker = null; } _etaTargetMs = null; };
    // Active or completed visit: the status card owns it, so hide the on the way banner
    if (!tv || (tv.time_in && !tv.time_out) || stage === 'in_progress' || stage === 'complete') {
      banner.style.display = 'none'; stopTicker(); return;
    }
    if (stage === 'en_route' || stage === 'running_late') {
      const pswFirst = (tv.psw_name || 'Your PSW').split(' ')[0];
      _etaTargetMs = tv.eta ? new Date(tv.eta).getTime() : null;
      if (etaText) etaText.textContent = stage === 'running_late' ? (pswFirst + ' is running a little late') : (pswFirst + ' is on the way to you');
      if (etaTime) etaTime.textContent = _fmtEtaCountdown();
      banner.style.display = 'flex';
      if (_etaTicker) clearInterval(_etaTicker);
      _etaTicker = setInterval(() => {
        const el = document.getElementById('eta-time');
        if (el && _etaTargetMs) el.textContent = _fmtEtaCountdown();
      }, 30000);
      return;
    }
    banner.style.display = 'none'; stopTicker();
  } catch { }
}

/* ── WEEKLY CARE SUMMARY ──────────────────────────────────────────
   The AI already writes care_signals on every visit as
   { type, severity, detail }, and no portal has ever shown them.

   This translates rather than exposes. The severity labels are written
   for the office (HIGH means same day action), and a daughter reading
   "fall_risk HIGH" at 11pm with no next step is worse off than before.
   So: plain language, always paired with what the office is doing, and
   a stable week leads with the fact that it is stable. For a family who
   cannot see the small daily changes, "nothing needs your attention"
   is the most useful sentence on the screen. */
const CARE_SIGNAL_WORDS = {
  fall_risk:         'steadiness on their feet',
  pain:              'pain or discomfort',
  confusion:         'memory or orientation',
  medication_concern:'medications',
  behavioral_change: 'mood and behaviour',
  appetite_hydration:'appetite and drinking',
  skin_integrity:    'skin condition',
  mobility_decline:  'moving around'
};

function loadCareWeek() {
  const el = document.getElementById('care-week-card');
  if (!el || !portalData) return;
  const visits = (portalData.visits || []).filter(v => v.time_in);
  if (!visits.length) return;

  const now = new Date();
  const cutoff = new Date(now.getTime() - 7 * 86400000).toISOString().slice(0, 10);
  const week = visits.filter(v => (v.visit_date || '') >= cutoff);
  if (!week.length) return;

  /* Group this week's signals by what they are about, keeping the highest
     severity seen and the most recent plain English detail. */
  const groups = {};
  week.forEach(v => {
    if (!Array.isArray(v.care_signals)) return;
    v.care_signals.forEach(s => {
      if (!s || !s.type) return;
      const key = s.type;
      const rank = { HIGH: 0, MED: 1, LOW: 2 }[s.severity] ?? 3;
      if (!groups[key] || rank < groups[key].rank) {
        groups[key] = { rank, severity: s.severity, date: v.visit_date };
      }
    });
  });
  const keys = Object.keys(groups);

  const visitCount = week.length;
  const psws = [...new Set(week.map(v => v.psw_name).filter(Boolean))];
  const who = psws.length === 1 ? psws[0].split(' ')[0] : psws.length + ' caregivers';
  const firstName = (portalData.client && portalData.client.first_name) || 'Your family member';

  let body = '';
  let tone = 'calm';

  if (!keys.length) {
    body = `${visitCount} visit${visitCount !== 1 ? 's' : ''} this week with ${escHtml(who)}. `
         + `Nothing about ${escHtml(firstName)}'s care needs your attention right now.`;
  } else {
    tone = keys.some(k => groups[k].severity === 'HIGH') ? 'attention' : 'watch';
    const lines = keys
      .sort((a, b) => groups[a].rank - groups[b].rank)
      .slice(0, 3)
      .map(k => {
        const what = CARE_SIGNAL_WORDS[k] || 'their care';
        /* AD1: g.detail is NOT rendered, and must not be. The AI writes it from
           PHIPA anonymised input, so it refers to the client as CLIENT-A rather
           than by name, and it is written for the office: "documented per
           Ontario standards, a pattern of refusal warrants monitoring". A
           daughter should never read her mother called CLIENT-A, and that
           sentence is a compliance note, not news about her mother.
           The plain line above already says what changed, which was the entire
           point of this card. */
        return `<div style="margin-top:8px;">`
             + `<div style="font-size:15px;line-height:1.6;color:var(--rb-text);">Your care team noted something about ${escHtml(what)}.</div>`
             + `</div>`;
      }).join('');
    const closing = tone === 'attention'
      ? 'Your coordinator has been notified and is following up today.'
      : 'Your coordinator is aware and is keeping an eye on it.';
    body = `<div style="font-size:15px;line-height:1.6;color:var(--rb-text);">`
         + `${visitCount} visit${visitCount !== 1 ? 's' : ''} this week with ${escHtml(who)}.</div>`
         + lines
         + `<div style="font-size:14px;line-height:1.6;color:var(--rb-dim);margin-top:10px;">${closing}</div>`;
  }

  const accent = tone === 'attention' ? 'var(--amber)' : tone === 'watch' ? 'var(--rb-gold)' : 'var(--rb-primary)';
  const label  = tone === 'attention' ? 'This Week, Please Read' : 'This Week';

  /* AD2: a quiet week is the common case, and it was rendering a bordered panel
     with an uppercase eyebrow to say nothing is wrong. That is roughly half a
     phone screen spent on the least information. One quiet line instead, and
     the panel is kept for the weeks that have something to say. */
  if (tone === 'calm') {
    el.innerHTML =
      `<div style="font-size:15px;line-height:1.6;color:var(--rb-dim);padding:2px;">${body}</div>`;
    el.style.display = 'block';
    return;
  }

  el.innerHTML =
    `<div style="background:var(--rb-panel);border:1px solid var(--rb-line2);border-left:3px solid ${accent};border-radius:10px;padding:14px 16px;">`
  + `<div style="font-family:var(--rb-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:${accent};margin-bottom:8px;">${label}</div>`
  + body
  + `</div>`;
  el.style.display = 'block';
}

// ── VITALS FORMATTING ──
// window._visitVitals was declared here and written NOWHERE, so the Health
// Readings block below could never render. Removed rather than wired: the
// server now sends visit_vitals on the portal payload, and reading straight
// off portalData means there is no global to keep in sync with the three
// places portalData is assigned.

function formatVitalsCompact(v) {
  if (!v) return '';
  const pills = [];
  if (v.blood_pressure_systolic && v.blood_pressure_diastolic) {
    const flag = v.blood_pressure_systolic > 140 || v.blood_pressure_diastolic > 90;
    pills.push(`<span class="vitals-pill ${flag?'flag':'ok'}">BP ${v.blood_pressure_systolic}/${v.blood_pressure_diastolic}</span>`);
  }
  if (v.pulse) pills.push(`<span class="vitals-pill ok">Pulse ${v.pulse}</span>`);
  if (v.oxygen_saturation) {
    const flag = v.oxygen_saturation < 95;
    pills.push(`<span class="vitals-pill ${flag?'flag':'ok'}">O₂ ${v.oxygen_saturation}%</span>`);
  }
  if (v.temperature) {
    const flag = v.temperature > 38.5;
    pills.push(`<span class="vitals-pill ${flag?'flag':'ok'}">${v.temperature}°C</span>`);
  }
  if (!pills.length) return '';
  const allNormal = !v.flagged;
  return pills.join('') + (allNormal ? '<div style="font-family:var(--mono);font-size:14px;color:var(--teal2);margin-top:4px;">✓ All readings within normal range</div>' : '<div style="font-family:var(--mono);font-size:14px;color:var(--amber);margin-top:4px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:1em;height:1em;vertical-align:-0.12em;"><path d="M12 3 2 20h20L12 3zM12 9v5M12 17v.01"/></svg> Some readings flagged, coordinator notified</div>');
}

// ── FAMILY VISIT RANGE HELPERS ──
function getFamDateRange() {
  const now = new Date();
  const toISO = d => d.toISOString().slice(0, 10);
  const y = now.getFullYear(), m = now.getMonth(), day = now.getDate();
  if (famVisitRange === 'today') {
    const d = toISO(now); return { from: d, to: d, label: 'Today' };
  }
  if (famVisitRange === 'week') {
    const dow = now.getDay() === 0 ? 6 : now.getDay() - 1;
    const start = new Date(now); start.setDate(day - dow); start.setHours(0,0,0,0);
    return { from: toISO(start), to: toISO(now), label: 'This Week' };
  }
  if (famVisitRange === 'month') {
    return { from: toISO(new Date(y, m, 1)), to: toISO(now), label: now.toLocaleString('en-CA', { month: 'long', year: 'numeric' }) };
  }
  if (famVisitRange === 'lastmonth') {
    const start = new Date(y, m - 1, 1);
    const end = new Date(y, m, 0);
    return { from: toISO(start), to: toISO(end), label: start.toLocaleString('en-CA', { month: 'long', year: 'numeric' }) };
  }
  if (famVisitRange === 'year') {
    return { from: toISO(new Date(y, 0, 1)), to: toISO(now), label: String(y) };
  }
  if (famVisitRange === 'custom' && famCustomFrom && famCustomTo) {
    return { from: famCustomFrom, to: famCustomTo, label: famCustomFrom + ' to ' + famCustomTo };
  }
  return { from: toISO(new Date(y, m, 1)), to: toISO(now), label: now.toLocaleString('en-CA', { month: 'long', year: 'numeric' }) };
}

function setFamRange(mode) {
  famVisitRange = mode;
  if (mode !== 'custom') { famCustomFrom = ''; famCustomTo = ''; }
  showTab('visits');
}

function applyFamCustomRange() {
  const f = document.getElementById('fam-custom-from')?.value;
  const t = document.getElementById('fam-custom-to')?.value;
  if (!f || !t) return;
  if (f > t) return;
  famCustomFrom = f; famCustomTo = t;
  showTab('visits');
}

// Typed name plus an explicit confirmation. Both are required by the server
// and neither is inferred, because a signature that was not deliberately
// given is worse than no signature at all.
async function signAgreement(id) {
  const name = (prompt('Type your full name to sign this agreement') || '').trim();
  if (!name) return;
  if (name.length < 2) { alert('Please type your full name.'); return; }
  if (!confirm('By signing you confirm you have read and agree to the terms of this agreement.')) return;
  try {
    const r = await fetch(famUrl('/family/sign-document'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, pin: famPin(), document_id: id, typed_name: name, agree: true })
    });
    const d = await r.json();
    if (!r.ok || !d.success) {
      alert(d && d.error ? d.error : 'Could not record your signature. Please try again.');
      return;
    }
    alert(d.already_signed ? 'This agreement was already signed.' : 'Thank you. Your signature has been recorded.');
    await loadFamilyDocs();
    showTab('care');
  } catch (e) {
    alert('Could not record your signature. Please try again.');
  }
}
